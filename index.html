<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - CEIN Victoria Gamus de Ghetea</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff !important;
            color: #000000 !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #ffffff !important;
            border-bottom: 2px solid #000000 !important;
        }
        .card {
            background-color: #ffffff !important;
            border: 2px solid #000000 !important;
            box-shadow: none !important;
        }
        h1, h2, h3, h4, h5, h6, label, p, span, th, td, a, .text-muted {
            color: #000000 !important;
        }
        .btn-custom {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 2px solid #000000 !important;
            font-weight: bold;
        }
        .btn-custom:hover {
            background-color: #333333 !important;
            color: #ffffff !important;
        }
        .form-control {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 2px solid #000000 !important;
        }
        .form-control::placeholder {
            color: #666666 !important;
        }
        table {
            background-color: #ffffff !important;
            color: #000000 !important;
        }
        .table-bordered, .table-bordered th, .table-bordered td {
            border-color: #000000 !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-light mb-4 py-3">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold fs-3">CEIN Victoria Gamus de Ghetea</span>
            <span class="fw-bold fs-5">Directora: Vilma Valencia</span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row mb-4">
            <div class="col-md-12 text-center">
                <h2 class="fw-bold">Control de Inventario</h2>
            </div>
        </div>

        <!-- FORMULARIO PARA AGREGAR -->
        <div class="card p-4 mb-4">
            <h4 class="mb-3 fw-bold">Agregar Producto</h4>
            <form id="addForm" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Nombre del Producto</label>
                    <input type="text" class="form-control" id="addName" placeholder="Ej. Jabón" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Cantidad</label>
                    <input type="number" class="form-control" id="addQty" min="1" value="1" required>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-custom w-100 py-2">Agregar</button>
                </div>
            </form>
        </div>

        <!-- LISTA PRINCIPAL DE PRODUCTOS CON BOTÓN DE MENOS Y ELIMINAR -->
        <div class="card p-4">
            <h4 class="mb-3 fw-bold">Lista de Productos Disponibles</h4>
            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead>
                        <tr>
                            <th class="fw-bold fs-5">Producto</th>
                            <th class="fw-bold fs-5">Cantidad (Quedan)</th>
                            <th class="fw-bold fs-5 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable">
                        <!-- Se llena automáticamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let inventory = JSON.parse(localStorage.getItem('victoria_inv_simple')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            renderInventory();

            document.getElementById('addForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const name = document.getElementById('addName').value.trim();
                const qty = parseInt(document.getElementById('addQty').value);

                if (!name || isNaN(qty)) return;

                const existing = inventory.find(item => item.name.toLowerCase() === name.toLowerCase());
                if (existing) {
                    existing.stock += qty;
                } else {
                    inventory.push({ name: name, stock: qty });
                }

                saveAndRefresh();
                this.reset();
            });
        });

        function saveAndRefresh() {
            localStorage.setItem('victoria_inv_simple', JSON.stringify(inventory));
            renderInventory();
        }

        function renderInventory() {
            const tbody = document.getElementById('inventoryTable');
            tbody.innerHTML = '';
            if (inventory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center fw-bold py-4">No hay productos en la lista.</td></tr>';
                return;
            }
            inventory.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold fs-5">${item.name}</td>
                        <td class="fw-bold fs-5 text-success">${item.stock}</td>
                        <td class="text-center">
                            <button class="btn btn-warning btn-sm fw-bold px-3 me-2" onclick="subtractOne(${index})">Restar (-1)</button>
                            <button class="btn btn-danger btn-sm fw-bold px-3" onclick="deleteProduct(${index})">Eliminar</button>
                        </td>
                    </tr>`;
            });
        }

        function subtractOne(index) {
            if (inventory[index].stock > 0) {
                inventory[index].stock -= 1;
                saveAndRefresh();
            } else {
                alert('Ya no quedan unidades de este producto.');
            }
        }

        function deleteProduct(index) {
            if (confirm('¿Eliminar este producto?')) {
                inventory.splice(index, 1);
                saveAndRefresh();
            }
        }
    </script>
</body>
</html>
